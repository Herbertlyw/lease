server:
  address: 127.0.0.1
  port: 8080
spring:
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    url: jdbc:mysql://${LEASE_DB_HOST:127.0.0.1}:${LEASE_DB_PORT:13316}/lease?characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${LEASE_DB_USER:lease}
    password: ${LEASE_DB_PASSWORD:lease-local}
  data:
    redis:
      host: ${LEASE_REDIS_HOST:127.0.0.1}
      port: ${LEASE_REDIS_PORT:16389}
springdoc:
  default-flat-param-object: true
