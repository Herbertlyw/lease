services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: lease
      MYSQL_USER: lease
      MYSQL_PASSWORD: ${LEASE_DB_PASSWORD:-lease-local}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${LEASE_DB_PORT:-13316}:3306"
    volumes:
      - "${LEASE_MYSQL_DATA:-lease-data}:/var/lib/mysql"
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT id FROM room_info LIMIT 1'"]
      interval: 3s
      timeout: 5s
      retries: 40
  redis:
    image: redis:6.2
    ports:
      - "127.0.0.1:${LEASE_REDIS_PORT:-16389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  lease-data:
